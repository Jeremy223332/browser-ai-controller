<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Browser AI</title>

  <style>
    body {
      margin: 0;
      padding: 18px;
      background: #101014;
      color: white;
      font-family: Arial, sans-serif;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 24px;
    }

    .subtitle {
      color: #999;
      font-size: 13px;
      margin-bottom: 18px;
    }

    #command {
      width: 100%;
      height: 90px;
      box-sizing: border-box;
      resize: vertical;
      padding: 12px;
      border: 1px solid #333;
      border-radius: 10px;
      background: #1b1b21;
      color: white;
      font-size: 14px;
      outline: none;
    }

    #command:focus {
      border-color: #5865f2;
    }

    #run {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #5865f2;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    #run:hover {
      background: #4752c4;
    }

    #status {
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      background: #18181d;
      border: 1px solid #29292f;
      min-height: 80px;
      font-size: 13px;
      line-height: 1.6;
    }

    .action {
      margin-top: 5px;
    }

    .success {
      color: #7cff9b;
    }

    .working {
      color: #8eb4ff;
    }
  </style>
</head>

<body>

  <h1>🤖 Browser AI</h1>

  <div class="subtitle">
    Tell me what you want me to do.
  </div>

  <textarea
    id="command"
    placeholder="Example: Search YouTube for FNAF 4 music and play the first result."
  ></textarea>

  <button id="run">RUN</button>

  <div id="status">
    <div class="working">Ready.</div>
  </div>

  <script src="popup.js"></script>

</body>
</html>
