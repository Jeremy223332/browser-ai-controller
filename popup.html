<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Browser AI Controller</title>

  <style>
    body {
      width: 350px;
      min-height: 300px;
      margin: 0;
      padding: 20px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      box-sizing: border-box;
    }

    h1 {
      margin-top: 0;
      font-size: 22px;
    }

    #command {
      width: 100%;
      height: 90px;
      box-sizing: border-box;
      resize: none;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: white;
      font-size: 14px;
    }

    #run {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #5865f2;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    #run:hover {
      background: #4752c4;
    }

    #status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      background: #1d1d1d;
      min-height: 40px;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <h1>🤖 Browser AI</h1>

  <textarea
    id="command"
    placeholder="Tell me what to do..."
  ></textarea>

  <button id="run">RUN</button>

  <div id="status">
    Ready.
  </div>

  <script src="popup.js"></script>

</body>
</html>
